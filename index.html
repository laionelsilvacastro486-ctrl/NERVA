<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =====================================================
   NERVA — AUTENTICAÇÃO REAL
   ===================================================== */

const SUPABASE_URL =
"https://vtjibeowavgzgjuzquif.supabase.co";

/*
   IMPORTANTE:
   COLE AQUI A SUA CHAVE PUBLICÁVEL
   DO SUPABASE.

   Ela começa com:
   sb_publishable_

   NÃO coloque a secret key.
*/
const SUPABASE_KEY =
"sb_publishable_lnE4vgQjNHJob2E3Z6aA5Q_DaLEOT3p";

let supabaseClient;
let currentSession = null;
let currentUser = null;


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

function iniciarSupabase(){

    if(
        !SUPABASE_KEY ||
        SUPABASE_KEY === "COLE_AQUI_SUA_CHAVE_PUBLICAVEL"
    ){

        mostrarErro(
            "A conexão com o banco ainda não foi configurada."
        );

        return false;
    }

    if(
        !window.supabase ||
        !window.supabase.createClient
    ){

        mostrarErro(
            "Não foi possível carregar o sistema de banco."
        );

        return false;
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );

    return true;
}


/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarErro(mensagem){

    const elemento =
        document.getElementById("authNotice");

    if(!elemento) return;

    elemento.innerHTML = `
        <div style="
            padding:13px;
            margin-bottom:15px;
            border-radius:12px;
            background:#401A25;
            border:1px solid #B81A2B;
            color:#fff;
            line-height:1.45;
        ">
            ${escapar(mensagem)}
        </div>
    `;
}


function mostrarSucesso(mensagem){

    const elemento =
        document.getElementById("authNotice");

    if(!elemento) return;

    elemento.innerHTML = `
        <div style="
            padding:13px;
            margin-bottom:15px;
            border-radius:12px;
            background:#242F39;
            border:1px solid #FFA586;
            color:#FFA586;
            line-height:1.45;
        ">
            ${escapar(mensagem)}
        </div>
    `;
}


function escapar(texto){

    return String(texto ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   CADASTRO
   ===================================================== */

async function criarConta(){

    const nome =
        document
        .getElementById("name")
        ?.value
        ?.trim();

    const email =
        document
        .getElementById("email")
        ?.value
        ?.trim();

    const senha =
        document
        .getElementById("password")
        ?.value;

    const botao =
        document.getElementById("authButton");


    if(!nome){

        mostrarErro(
            "Digite seu nome."
        );

        return;
    }


    if(!email){

        mostrarErro(
            "Digite seu e-mail."
        );

        return;
    }


    if(!email.includes("@")){

        mostrarErro(
            "Digite um e-mail válido."
        );

        return;
    }


    if(!senha || senha.length < 6){

        mostrarErro(
            "A senha precisa ter pelo menos 6 caracteres."
        );

        return;
    }


    if(!supabaseClient){

        mostrarErro(
            "O banco ainda não foi inicializado."
        );

        return;
    }


    if(botao){

        botao.disabled = true;
        botao.textContent = "Criando conta...";
    }


    try{

        const resultado =
            await supabaseClient.auth.signUp({

                email:email,

                password:senha,

                options:{
                    data:{
                        display_name:nome
                    }
                }

            });


        if(resultado.error){

            throw resultado.error;
        }


        /*
           Se o Supabase estiver configurado
           para exigir confirmação de e-mail,
           a sessão poderá vir vazia.
        */

        if(!resultado.data.session){

            mostrarSucesso(
                "Conta criada! Confira seu e-mail para confirmar a conta e depois entre na NERVA."
            );

        }else{

            currentSession =
                resultado.data.session;

            currentUser =
                resultado.data.user;

            await prepararPerfil();

            entrarNoAplicativo();
        }


    }catch(erro){

        console.error(
            "Erro ao criar conta:",
            erro
        );


        let mensagem =
            erro?.message ||
            "Não foi possível criar sua conta.";


        if(
            mensagem
            .toLowerCase()
            .includes("already registered")
        ){

            mensagem =
                "Esse e-mail já possui uma conta. Entre na NERVA.";

        }


        mostrarErro(mensagem);


    }finally{

        if(botao){

            botao.disabled = false;

            botao.textContent =
                "Criar conta";

        }

    }
}


/* =====================================================
   LOGIN
   ===================================================== */

async function entrarConta(){

    const email =
        document
        .getElementById("email")
        ?.value
        ?.trim();

    const senha =
        document
        .getElementById("password")
        ?.value;

    const botao =
        document.getElementById("authButton");


    if(!email){

        mostrarErro(
            "Digite seu e-mail."
        );

        return;
    }


    if(!senha){

        mostrarErro(
            "Digite sua senha."
        );

        return;
    }


    if(!supabaseClient){

        mostrarErro(
            "O banco ainda não foi inicializado."
        );

        return;
    }


    if(botao){

        botao.disabled = true;
        botao.textContent = "Entrando...";
    }


    try{

        const resultado =
            await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:senha

            });


        if(resultado.error){

            throw resultado.error;
        }


        currentSession =
            resultado.data.session;

        currentUser =
            resultado.data.user;


        await prepararPerfil();

        entrarNoAplicativo();


    }catch(erro){

        console.error(
            "Erro no login:",
            erro
        );


        let mensagem =
            erro?.message ||
            "Não foi possível entrar.";


        if(
            mensagem
            .toLowerCase()
            .includes("invalid login credentials")
        ){

            mensagem =
                "E-mail ou senha incorretos.";

        }


        mostrarErro(mensagem);


    }finally{

        if(botao){

            botao.disabled = false;

            botao.textContent =
                "Entrar";

        }

    }
}


/* =====================================================
   BOTÃO PRINCIPAL
   ===================================================== */

async function enviarAutenticacao(){

    const modo =
        window.authMode || "login";


    if(modo === "signup"){

        await criarConta();

    }else{

        await entrarConta();

    }
}


/* =====================================================
   MODO ENTRAR / CRIAR CONTA
   ===================================================== */

function mudarModoAuth(modo){

    window.authMode = modo;


    const login =
        document.getElementById("tabLogin");

    const cadastro =
        document.getElementById("tabSignup");

    const nome =
        document.getElementById("nameField");

    const botao =
        document.getElementById("authButton");


    if(modo === "signup"){

        login?.classList.remove("active");
        cadastro?.classList.add("active");

        nome?.classList.remove("hidden");

        if(botao){

            botao.textContent =
                "Criar conta";

        }

    }else{

        login?.classList.add("active");
        cadastro?.classList.remove("active");

        nome?.classList.add("hidden");

        if(botao){

            botao.textContent =
                "Entrar";

        }

    }


    const aviso =
        document.getElementById("authNotice");

    if(aviso){

        aviso.innerHTML = "";

    }
}


/* Compatibilidade com os botões
   do código anterior */

function setAuthMode(modo){

    mudarModoAuth(modo);

}


/* =====================================================
   PERFIL NO BANCO
   ===================================================== */

async function prepararPerfil(){

    if(!currentUser) return;


    try{

        const existente =
            await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id",currentUser.id)
            .maybeSingle();


        if(existente.error){

            console.error(
                "Erro buscando perfil:",
                existente.error
            );

            return;
        }


        if(!existente.data){

            const nome =
                currentUser
                .user_metadata
                ?.display_name
                ||
                currentUser.email
                ?.split("@")[0]
                ||
                "Usuário NERVA";


            const username =
                gerarUsername(nome);


            const novoPerfil =
                await supabaseClient
                .from("profiles")
                .insert({

                    id:currentUser.id,

                    username:username,

                    display_name:nome,

                    bio:"",

                    is_artist:false,

                    is_verified:false

                });


            if(novoPerfil.error){

                console.error(
                    "Erro criando perfil:",
                    novoPerfil.error
                );

            }

        }

    }catch(erro){

        console.error(
            "Erro preparando perfil:",
            erro
        );

    }
}


/* =====================================================
   USERNAME
   ===================================================== */

function gerarUsername(nome){

    let resultado =
        String(nome)
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9]/g,
            ""
        )
        .slice(0,20);


    if(!resultado){

        resultado = "nervauser";

    }


    return resultado;
}


/* =====================================================
   ENTRAR NO APLICATIVO
   ===================================================== */

function entrarNoAplicativo(){

    const auth =
        document.getElementById("auth");

    const app =
        document.getElementById("app");


    auth?.classList.add("hidden");

    app?.classList.remove("hidden");


    /*
       Se o seu código já possuir
       a função go(), usamos ela.
    */

    if(typeof go === "function"){

        go("home");

    }

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function sairDaConta(){

    if(!supabaseClient) return;

    await supabaseClient.auth.signOut();

    currentSession = null;
    currentUser = null;

    document
        .getElementById("app")
        ?.classList
        .add("hidden");

    document
        .getElementById("auth")
        ?.classList
        .remove("hidden");
}


/* Compatibilidade */

async function logout(){

    await sairDaConta();

}


/* =====================================================
   RECUPERAR SESSÃO
   ===================================================== */

async function verificarSessao(){

    if(!supabaseClient) return;


    try{

        const resultado =
            await supabaseClient.auth
            .getSession();


        if(resultado.error){

            console.error(
                resultado.error
            );

            return;
        }


        currentSession =
            resultado.data.session;


        if(currentSession){

            currentUser =
                currentSession.user;

            await prepararPerfil();

            entrarNoAplicativo();

        }

    }catch(erro){

        console.error(
            "Erro verificando sessão:",
            erro
        );

    }


    supabaseClient.auth
    .onAuthStateChange(
        async(event,sessao)=>{

            currentSession =
                sessao;

            currentUser =
                sessao?.user || null;

        }
    );
}


/* =====================================================
   INICIAR
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async()=>{

        const conectado =
            iniciarSupabase();

        if(!conectado) return;

        /*
           O botão antigo do HTML agora
           chama nossa função correta.
        */

        const botao =
            document.getElementById(
                "authButton"
            );

        if(botao){

            botao.onclick =
                enviarAutenticacao;

        }


        await verificarSessao();

    }
);
          </script>
