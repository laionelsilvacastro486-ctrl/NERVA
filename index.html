<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NERVA</title>
<meta name="theme-color" content="#18202F">

<style>
:root{
  --bg:#18202F;
  --panel:#242F39;
  --panel2:#384358;
  --accent:#FFA586;
  --red:#B81A2B;
  --wine:#401A25;
  --text:#F5F7FA;
  --muted:#AAB3C2;
  --line:rgba(255,255,255,.09);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   TOPO
========================= */

.top{
  height:68px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 22px;
  position:sticky;
  top:0;
  background:rgba(24,32,47,.94);
  backdrop-filter:blur(16px);
  z-index:20;
}

.logo{
  font-weight:900;
  letter-spacing:.12em;
  font-size:21px;
}

.search{
  flex:1;
  max-width:620px;
}

.search input,
.field input,
.field textarea,
.field select{
  width:100%;
  background:#1d2735;
  border:1px solid var(--line);
  color:var(--text);
  padding:13px 15px;
  border-radius:12px;
  outline:none;
}

.search input:focus,
.field input:focus,
.field textarea:focus{
  border-color:var(--accent);
}

/* =========================
   ESTRUTURA
========================= */

.app{
  min-height:100vh;
}

.layout{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:calc(100vh - 68px);
}

.side{
  border-right:1px solid var(--line);
  padding:20px 14px;
  position:sticky;
  top:68px;
  height:calc(100vh - 68px);
}

.nav{
  display:grid;
  gap:5px;
}

.nav button,
.mobile button{
  background:none;
  border:0;
  color:var(--muted);
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
}

.nav button.active,
.nav button:hover,
.mobile button.active{
  background:rgba(255,165,134,.09);
  color:var(--text);
}

.main{
  padding:28px;
  max-width:1250px;
  width:100%;
  margin:auto;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* =========================
   TEXTOS
========================= */

h1{
  font-size:34px;
  margin:0 0 8px;
}

h2{
  font-size:22px;
  margin:0 0 10px;
}

h3{
  margin:12px 0 7px;
}

.sub{
  color:var(--muted);
  line-height:1.55;
}

.muted{
  color:var(--muted);
}

/* =========================
   CARDS
========================= */

.hero{
  background:linear-gradient(
    135deg,
    #242F39,
    #1d2735
  );
  border:1px solid var(--line);
  border-radius:24px;
  padding:30px;
  margin-bottom:22px;
}

.hero strong{
  color:var(--accent);
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:14px;
}

.grid2{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}

.card:hover{
  border-color:rgba(255,165,134,.22);
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

.between{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.stack{
  display:grid;
  gap:14px;
}

/* =========================
   BOTÕES
========================= */

.btn{
  border:1px solid var(--line);
  background:#1c2634;
  color:var(--text);
  padding:11px 15px;
  border-radius:11px;
}

.btn:hover{
  border-color:rgba(255,165,134,.35);
}

.btn.primary{
  background:var(--accent);
  color:#18202F;
  border-color:var(--accent);
  font-weight:800;
}

.btn.red{
  background:var(--red);
  border-color:var(--red);
}

.btn.ghost{
  background:transparent;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(255,165,134,.1);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}

/* =========================
   AVATAR / CAPAS
========================= */

.avatar{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--panel2);
  display:grid;
  place-items:center;
  font-weight:900;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cover{
  height:150px;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      var(--wine),
      var(--panel2)
    );
  margin-bottom:13px;
  overflow:hidden;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================
   LISTAS
========================= */

.list{
  display:grid;
  gap:10px;
}

.item{
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#202b3a;
}

.stat{
  font-size:28px;
  font-weight:900;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:50;
}

.modalbox{
  width:min(560px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.field{
  display:grid;
  gap:7px;
  margin:12px 0;
}

.field label{
  font-size:13px;
  color:var(--muted);
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

/* =========================
   AVISOS
========================= */

.notice{
  padding:12px 14px;
  border-radius:12px;
  background:#202b3a;
  border:1px solid var(--line);
  color:var(--muted);
}

.notice.error{
  border-color:rgba(184,26,43,.55);
  color:#ffd7dc;
}

.notice.ok{
  border-color:rgba(255,165,134,.4);
  color:#ffe3d8;
}

.empty{
  padding:35px;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:18px;
  color:var(--muted);
}

/* =========================
   AUTENTICAÇÃO
========================= */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 80% 10%,
      rgba(184,26,43,.18),
      transparent 32%
    ),
    var(--bg);
}

.authbox{
  width:min(440px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
}

.authlogo{
  font-weight:950;
  letter-spacing:.16em;
  font-size:27px;
  margin-bottom:22px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#1d2735;
  border-radius:12px;
  padding:4px;
  margin-bottom:18px;
}

.auth-tabs button{
  border:0;
  background:none;
  color:var(--muted);
  padding:10px;
  border-radius:9px;
}

.auth-tabs button.active{
  background:var(--panel2);
  color:var(--text);
}

/* =========================
   MOBILE
========================= */

.mobile{
  display:none;
}

@media(max-width:900px){

  .layout{
    grid-template-columns:1fr;
  }

  .side{
    display:none;
  }

  .mobile{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:64px;
    background:rgba(24,32,47,.96);
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:
      repeat(5,1fr);
    z-index:30;
  }

  .mobile button{
    text-align:center;
    font-size:11px;
    padding:8px;
  }

  .main{
    padding:20px 16px 88px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .top{
    padding:0 14px;
  }

  .search{
    display:none;
  }

  h1{
    font-size:29px;
  }
}
</style>
</head>

<body>

<!-- =========================
     AUTENTICAÇÃO
========================= -->

<div id="auth" class="auth">

  <div class="authbox">

    <div class="authlogo">
      NERVA
    </div>

    <div
      class="sub"
      style="margin-bottom:20px"
    >

    </div>

    <div class="auth-tabs">

      <button
        id="tabLogin"
        class="active"
        onclick="setAuthMode('login')"
      >
        Entrar
      </button>

      <button
        id="tabSignup"
        onclick="setAuthMode('signup')"
      >
        Criar conta
      </button>

    </div>

    <div id="authNotice"></div>

    <div
      id="nameField"
      class="field hidden"
    >
      <label>Nome</label>

      <input
        id="name"
        autocomplete="name"
      >
    </div>

    <div class="field">

      <label>E-mail</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
      >

    </div>

    <div class="field">

      <label>Senha</label>

      <input
        id="password"
        type="password"
        minlength="6"
        autocomplete="current-password"
      >

    </div>

    <button
      id="authButton"
      class="btn primary"
      style="width:100%;margin-top:5px"
      onclick="submitAuth()"
    >
      Entrar
    </button>

  </div>

</div>

<!-- =========================

========================= -->

<div id="app" class="app hidden">

<header class="top">

    <button

      Notícias
    </button>

    <button

      onclick="go('support')"

      Suporte
    </button>

  </div>

</aside>

<main class="main">

<section

  class="view"
></section>

<section

  class="view"
></section>

<section
  id="now"
  class="view"
></section>

<section
  id="charts"

></section>

  class="view"
></section>

<section
  id="support"
  class="view"
></section>

<section
  id="results"
  class="view"
></section>

</main>

</div>

<nav class="mobile">

<button
  data-view="home"
  onclick="go('home')"
>
  Início
</button>

<button
  data-view="discover"
  onclick="go('discover')"
>
  Descobrir
</button>

<button

>

</div>

========================= -->

  class="modal hidden"
>

</div>

</div>
