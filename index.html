<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#18202F">
<title>NERVA</title>

<style>
:root{
  --bg:#18202F;
  --surface:#242F39;
  --surface2:#384358;
  --coral:#FFA586;
  --red:#B81A2B;
  --wine:#401A25;
  --white:#F7F7F7;
  --muted:#AEB6C3;
  --border:rgba(255,255,255,.09);
  --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--white);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   INTRO
========================= */

#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.7s ease;
}

.intro-logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:8px;
  color:var(--coral);
  animation:logoIn 1.2s ease;
}

@keyframes logoIn{
  from{
    opacity:0;
    transform:scale(.88);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
}

.topbar{
  height:72px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(24,32,47,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:24px;
}

.brand{
  font-weight:900;
  font-size:22px;
  letter-spacing:4px;
  color:var(--coral);
  cursor:pointer;
}

.search{
  flex:1;
  max-width:560px;
  position:relative;
}

.search input{
  width:100%;
  height:42px;
  border:none;
  outline:none;
  border-radius:12px;
  background:var(--surface);
  color:white;
  padding:0 16px;
  border:1px solid var(--border);
}

.search input::placeholder{
  color:#8d97a7;
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:10px;
  align-items:center;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--surface);
  color:white;
  border-radius:12px;
}

.avatar-small{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:var(--coral);
  cursor:pointer;
}

/* =========================
   LAYOUT
========================= */

.layout{
  display:flex;
  min-height:calc(100vh - 72px);
}

.sidebar{
  width:240px;
  border-right:1px solid var(--border);
  padding:24px 14px;
  position:sticky;
  top:72px;
  height:calc(100vh - 72px);
  background:#1b2433;
}

.nav-title{
  color:#707b8e;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.4px;
  padding:0 12px 10px;
}

.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:transparent;
  color:#c8ced8;
  padding:12px;
  border-radius:10px;
  text-align:left;
  margin-bottom:4px;
}

.nav-item:hover,
.nav-item.active{
  background:var(--surface);
  color:white;
}

.nav-item.active{
  border-left:3px solid var(--coral);
}

.main{
  flex:1;
  min-width:0;
  padding:32px;
  max-width:1500px;
  margin:auto;
  width:100%;
}

/* =========================
   TYPOGRAPHY
========================= */

.page-title{
  font-size:34px;
  font-weight:850;
  letter-spacing:-1px;
}

.page-subtitle{
  color:var(--muted);
  margin-top:7px;
}

.section{
  margin-top:34px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:16px;
}

.section-title{
  font-size:21px;
  font-weight:800;
}

.link-btn{
  color:var(--coral);
  border:0;
  background:none;
}

/* =========================
   HERO
========================= */

.hero{
  border:1px solid var(--border);
  border-radius:24px;
  min-height:300px;
  background:
    radial-gradient(circle at 80% 20%,rgba(255,165,134,.13),transparent 28%),
    linear-gradient(135deg,#242F39,#18202F);
  padding:38px;
  display:flex;
  align-items:flex-end;
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  right:-150px;
  bottom:-220px;
  border-radius:50%;
  background:rgba(184,26,43,.13);
}

.hero-content{
  position:relative;
  z-index:1;
  max-width:700px;
}

.hero-label{
  color:var(--coral);
  font-weight:800;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hero h1{
  font-size:44px;
  line-height:1.02;
  margin-top:10px;
}

.hero p{
  margin-top:14px;
  color:#c5cbd4;
  line-height:1.6;
  max-width:650px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:11px;
  padding:11px 17px;
  font-weight:750;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--coral);
  color:#18202F;
}

.btn-danger{
  background:var(--red);
  color:white;
}

.btn-secondary{
  background:var(--surface2);
  color:white;
  border:1px solid var(--border);
}

.btn-ghost{
  background:transparent;
  color:#dbe0e8;
  border:1px solid var(--border);
}

/* =========================
   CARDS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.card-body{
  padding:16px;
}

.card-title{
  font-weight:800;
}

.card-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.cover{
  width:100%;
  aspect-ratio:1;
  background:
    linear-gradient(145deg,#384358,#401A25);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--coral);
  font-size:30px;
  font-weight:900;
}

.artist-card{
  cursor:pointer;
  transition:.2s ease;
}

.artist-card:hover{
  transform:translateY(-3px);
}

.artist-avatar{
  width:100%;
  aspect-ratio:1;
  background:
    linear-gradient(145deg,#384358,#242F39);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
  color:var(--coral);
}

.verified{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--coral);
  color:var(--bg);
  font-size:11px;
  font-weight:900;
  margin-left:5px;
}

/* =========================
   CHART
========================= */

.chart-list{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.chart-row{
  display:flex;
  align-items:center;
  gap:16px;
  padding:15px 18px;
  border-bottom:1px solid var(--border);
}

.chart-row:last-child{
  border-bottom:0;
}

.chart-number{
  width:32px;
  color:var(--muted);
  font-weight:800;
}

.chart-art{
  width:50px;
  height:50px;
  border-radius:9px;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--coral);
  font-weight:900;
}

.chart-info{
  flex:1;
}

.chart-name{
  font-weight:800;
}

.chart-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.chart-score{
  color:var(--coral);
  font-weight:800;
}

/* =========================
   PROFILE
========================= */

.profile-head{
  background:linear-gradient(145deg,#242F39,#18202F);
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px;
  display:flex;
  gap:24px;
  align-items:center;
}

.profile-avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  color:var(--coral);
  font-weight:900;
}

.profile-info{
  flex:1;
}

.profile-name{
  font-size:28px;
  font-weight:900;
}

.profile-handle{
  color:var(--muted);
  margin-top:4px;
}

.profile-bio{
  margin-top:12px;
  color:#c5cbd4;
  max-width:700px;
}

.stats{
  display:flex;
  gap:28px;
  margin-top:18px;
}

.stat strong{
  display:block;
  font-size:19px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   SEARCH
========================= */

.search-results{
  margin-top:20px;
}

.result-block{
  margin-bottom:30px;
}

.result-list{
  display:grid;
  gap:10px;
}

.result{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:13px;
  cursor:pointer;
}

.result:hover{
  border-color:rgba(255,165,134,.35);
}

/* =========================
   MODALS
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#202b3b;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:26px;
}

.modal h2{
  font-size:24px;
}

.modal p{
  color:var(--muted);
  line-height:1.55;
  margin-top:8px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.close{
  border:0;
  background:transparent;
  color:#b8c0cc;
  font-size:25px;
}

.form{
  display:grid;
  gap:13px;
  margin-top:22px;
}

.label{
  color:#c8ced8;
  font-size:13px;
}

.input,
.textarea{
  width:100%;
  background:#18202F;
  border:1px solid var(--border);
  color:white;
  border-radius:11px;
  padding:12px 13px;
  outline:none;
}

.input:focus,
.textarea:focus{
  border-color:rgba(255,165,134,.6);
}

.textarea{
  min-height:110px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:5px;
}

/* =========================
   AUTH
========================= */

#authScreen{
  position:fixed;
  inset:0;
  z-index:900;
  background:
    radial-gradient(circle at 80% 10%,rgba(255,165,134,.10),transparent 25%),
    #18202F;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:min(470px,100%);
  background:#202b3b;
  border:1px solid var(--border);
  border-radius:24px;
  padding:34px;
  box-shadow:var(--shadow);
}

.auth-brand{
  color:var(--coral);
  font-size:30px;
  font-weight:900;
  letter-spacing:5px;
}

.auth-title{
  font-size:28px;
  font-weight:850;
  margin-top:28px;
}

.auth-text{
  color:var(--muted);
  margin-top:8px;
  line-height:1.5;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  background:#18202F;
  padding:5px;
  border-radius:12px;
  margin-top:24px;
}

.auth-tab{
  border:0;
  background:transparent;
  color:#8f99a9;
  padding:10px;
  border-radius:8px;
}

.auth-tab.active{
  background:var(--surface2);
  color:white;
}

.auth-message{
  margin-top:15px;
  font-size:13px;
  color:var(--coral);
}

/* =========================
   ONBOARDING
========================= */

#onboarding{
  position:fixed;
  inset:0;
  z-index:800;
  background:#18202F;
  overflow:auto;
  padding:30px 20px;
}

.onboarding-box{
  width:min(850px,100%);
  margin:0 auto;
}

.onboarding-brand{
  color:var(--coral);
  font-size:24px;
  font-weight:900;
  letter-spacing:4px;
}

.progress{
  height:5px;
  background:var(--surface);
  border-radius:5px;
  margin-top:24px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:25%;
  background:var(--coral);
  transition:.3s;
}

.onboarding-content{
  margin-top:60px;
}

.onboarding-title{
  font-size:38px;
  line-height:1.05;
}

.onboarding-text{
  color:var(--muted);
  margin-top:12px;
  max-width:650px;
  line-height:1.6;
}

.option-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:28px;
}

.option{
  padding:15px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  color:#d9dee7;
  text-align:left;
}

.option.selected{
  background:rgba(255,165,134,.1);
  border-color:var(--coral);
  color:var(--coral);
}

.onboarding-actions{
  display:flex;
  justify-content:space-between;
  margin-top:35px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:2000;
  background:#202b3b;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:12px;
  padding:14px 17px;
  max-width:360px;
  color:white;
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  transform:translateY(0);
  opacity:1;
}

/* =========================
   MOBILE
========================= */

.mobile-nav{
  display:none;
}

@media(max-width:1050px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:800px){
  .sidebar{
    display:none;
  }

  .topbar{
    padding:0 15px;
    gap:12px;
  }

  .search{
    max-width:none;
  }

  .top-actions{
    display:none;
  }

  .main{
    padding:22px 15px 90px;
  }

  .hero{
    padding:25px;
    min-height:280px;
  }

  .hero h1{
    font-size:34px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    bottom:0;
    left:0;
    right:0;
    height:67px;
    background:rgba(24,32,47,.97);
    backdrop-filter:blur(15px);
    border-top:1px solid var(--border);
    z-index:300;
    justify-content:space-around;
    padding:7px;
  }

  .mobile-nav button{
    background:none;
    border:0;
    color:#8994a5;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .mobile-nav button.active{
    color:var(--coral);
  }

  .profile-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .option-grid{
    grid-template-columns:1fr 1fr;
  }

  .onboarding-title{
    font-size:31px;
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .page-title{
    font-size:29px;
  }

  .option-grid{
    grid-template-columns:1fr;
  }

  .auth-box{
    padding:25px;
  }

  .stats{
    gap:18px;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-logo">NERVA</div>
</div>

<!-- AUTH -->
<div id="authScreen" class="hidden">
  <div class="auth-box">

    <div class="auth-brand">NERVA</div>

    <div class="auth-title" id="authTitle">
      Entre na NERVA
    </div>

    <div class="auth-text" id="authDescription">
      Crie sua conta para acompanhar artistas,
      lançamentos, eras, fandoms e tudo que acontece na comunidade.
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="showAuth('login')">
        Entrar
      </button>

      <button class="auth-tab" id="signupTab" onclick="showAuth('signup')">
        Criar conta
      </button>
    </div>

    <form class="form" onsubmit="handleAuth(event)">

      <div>
        <div class="label">Seu e-mail</div>
        <input
          id="authEmail"
          class="input"
          type="email"
          autocomplete="email"
          required
          placeholder="seu@email.com">
      </div>

      <div>
        <div class="label">Sua senha</div>
        <input
          id="authPassword"
          class="input"
          type="password"
          autocomplete="current-password"
          required
          minlength="6"
          placeholder="Mínimo de 6 caracteres">
      </div>

      <div id="signupNameBox" class="hidden">
        <div class="label">Como devemos chamar você?</div>
        <input
          id="authName"
          class="input"
          type="text"
          placeholder="Seu nome ou nome artístico">
      </div>

      <button class="btn btn-primary" id="authSubmit" type="submit">
        Entrar
      </button>

    </form>

    <div id="authMessage" class="auth-message"></div>

  </div>
</div>

<!-- ONBOARDING -->
<div id="onboarding" class="hidden">

  <div class="onboarding-box">

    <div class="onboarding-brand">NERVA</div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="onboardingContent"></div>

  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <header class="topbar">

    <div class="brand" onclick="navigate('home')">
      NERVA
    </div>

    <div class="search">
      <input
        id="globalSearch"
        type="search"
        placeholder="Buscar na NERVA..."
        onkeydown="if(event.key==='Enter')performSearch()">
    </div>

    <div class="top-actions">

      <button class="icon-btn" onclick="showNotifications()" title="Notificações">
        ◌
      </button>

      <div
        id="topAvatar"
        class="avatar-small"
        onclick="navigate('profile')">
        N
      </div>

    </div>

  </header>

  <div class="layout">

    <aside class="sidebar">

      <div class="nav-title">NERVA</div>

      <button class="nav-item active" data-page="home" onclick="navigate('home')">
        Início
      </button>

      <button class="nav-item" data-page="discover" onclick="navigate('discover')">
        Descobrir
      </button>

      <button class="nav-item" data-page="now" onclick="navigate('now')">
        Agora
      </button>

      <button class="nav-item" data-page="charts" onclick="navigate('charts')">
        Charts
      </button>

      <div class="nav-title" style="margin-top:25px">
        Comunidade
      </div>

      <button class="nav-item" data-page="artists" onclick="navigate('artists')">
        Artistas
      </button>

      <button class="nav-item" data-page="albums" onclick="navigate('albums')">
        Álbuns
      </button>

      <button class="nav-item" data-page="eras" onclick="navigate('eras')">
        Eras
      </button>

      <button class="nav-item" data-page="labels" onclick="navigate('labels')">
        Gravadoras
      </button>

      <button class="nav-item" data-page="fandoms" onclick="navigate('fandoms')">
        Fandoms
      </button>

      <button class="nav-item" data-page="news" onclick="navigate('news')">
        Notícias
      </button>

      <div class="nav-title" style="margin-top:25px">
        Você
      </div>

      <button class="nav-item" data-page="profile" onclick="navigate('profile')">
        Meu perfil
      </button>

      <button class="nav-item" onclick="openVerification()">
        Verificação
      </button>

      <button class="nav-item" onclick="openSupport()">
        Suporte NERVA
      </button>

      <button class="nav-item" onclick="logout()">
        Sair
      </button>

    </aside>

    <main class="main" id="main"></main>

  </div>

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  if(!name) return "N";

  return name
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function toast(message){

async function handleAuth(event){

  event.preventDefault();

  const email =
    document.getElementById("authEmail").value.trim();

  const password =
    document.getElementById("authPassword").value;

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("authSubmit");

  button.disabled = true;

  message.textContent =
    "Processando...";

  try{

    if(authMode === "signup"){

      const name =
        document.getElementById("authName").value.trim();

      if(!name){
        throw new Error(
          "Digite o nome que deseja usar na NERVA."
        );
      }

      const {data,error} =
        await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{
              display_name:name
            }
          }
        });

      if(error) throw error;

      if(!data.session){

        message.textContent =
          "Conta criada. Confira seu e-mail para confirmar a conta.";

        toast(
          "Enviamos um link de confirmação para seu e-mail."
        );

        return;
      }

      currentUser = data.user;

      await createOrUpdateProfile(
        currentUser,
        name
      );

      startOnboarding();

    }else{

      const {data,error} =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      currentUser = data.user;

      await loadProfile();

      if(!currentProfile){

        startOnboarding();

      }else{

        enterApp();

      }

    }

  }catch(error){

    console.error(error);

    message.textContent =
      friendlyAuthError(error.message);

  }finally{

    button.disabled = false;
  }
}

function friendlyAuthError(message){

  if(!message) return "Não foi possível concluir.";

  if(message.toLowerCase().includes("invalid login")){
    return "E-mail ou senha incorretos.";
  }

  if(message.toLowerCase().includes("already registered")){
    return "Este e-mail já possui uma conta.";
  }

  if(message.toLowerCase().includes("password")){
    return "A senha precisa ter pelo menos 6 caracteres.";
  }

  return message;
}

async function createOrUpdateProfile(user,name){

  const safeName =
    name ||
    user.user_metadata?.display_name ||
    user.email?.split("@")[0] ||
    "NERVA";

  const usernameBase =
    normalizeUsername(safeName);

  const username =
    await findAvailableUsername(usernameBase,user.id);

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .upsert({
        id:user.id,
        username,
        display_name:safeName,
        bio:"",
        avatar_url:"",
        is_artist:false,
        is_verified:false
      })
      .select()
      .single();

  if(error){
    console.error(error);
    return null;
  }

  currentProfile = data;

  return data;
}

function normalizeUsername(value){

  let result =
    String(value || "nerva")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"")
      .slice(0,18);

  if(!result) result = "nerva";

  return result;
}

async function findAvailableUsername(base,userId){

  let username = base;

  const {data} =
    await supabaseClient
      .from("profiles")
      .select("username,id")
      .eq("username",username)
      .maybeSingle();

  if(!data || data.id === userId){
    return username;
  }

  for(let i=2;i<100;i++){

    const candidate =
      `${base}${i}`;

    const {data:found} =
      await supabaseClient
        .from("profiles")
        .select("id")
        .eq("username",candidate)
        .maybeSingle();

    if(!found){
      return candidate;
    }
  }

  return `${base}${Date.now().toString().slice(-5)}`;
}

async function loadProfile(){

  if(!currentUser) return null;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return null;
  }

  currentProfile = data;

  return data;
}

function toggleGenre(genre){

  if(onboardingData.genres.includes(genre)){

      onboardingData.genres.filter(
        item => item !== genre

  }else{

    onboardingData.genres.push(genre);

  renderOnboarding();

function toggleFollowOnboarding(id){

  if(followedArtists.includes(id)){

    followedArtists =
      followedArtists.filter(
        item=>item!==id

  }else{

    followedArtists.push(id);

}

  if(onboardingStep === 2 &&
     onboardingData.genres.length === 0){

  onboardingStep++;

  renderOnboarding();

function previousOnboarding(){

  onboardingStep =
    Math.max(1,onboardingStep-1);

}

/* ==========================================================
   SEARCH
========================================================== */

function performSearch(){

  const value =
    document
      .getElementById("globalSearch")
      .value
      .trim();

  if(!value){
    return;
  }

  const query =
    value.toLowerCase();

  const artists =
    demoArtists.filter(
      artist =>
        artist.name.toLowerCase().includes(query) ||
        artist.username.toLowerCase().includes(query) ||
        artist.genres.some(
          g=>g.toLowerCase().includes(query)
        )
    );

  const albums =
    demoAlbums.filter(
      album =>
        album.title.toLowerCase().includes(query) ||
        album.artist.toLowerCase().includes(query)
    );

  document.getElementById("main").innerHTML = `

    <div>
      <div class="page-title">
        Resultados
      </div>

      <div class="page-subtitle">
        Busca por “${escapeHTML(value)}”
      </div>
    </div>

    <div class="search-results">

      <div class="result-block">

        <div class="section-title">
          Artistas
        </div>

        <div class="result-list" style="margin-top:14px">

          ${
            artists.length
            ? artists.map(artist=>`

              <div
                class="result"
                onclick="openArtist('${artist.id}')">

                <div class="chart-art">
                  ${initials(artist.name)}
                </div>

                <div>
                  <strong>
                    ${escapeHTML(artist.name)}
                  </strong>

                  <div class="chart-meta">
                    @${escapeHTML(artist.username)}
                  </div>
                </div>

              </div>

            `).join("")
            : `<div class="card"><div class="card-body">Nenhum artista encontrado.</div></div>`
          }

        </div>

      </div>

      <div class="result-block">

        <div class="section-title">
          Álbuns
        </div>

        <div class="result-list" style="margin-top:14px">

          ${
            albums.length
            ? albums.map(album=>`

              <div
                class="result"
                onclick="openAlbum('${escapeHTML(album.title)}')">

                <div class="chart-art">
                  ${initials(album.title)}
                </div>

                <div>
                  <strong>
                    ${escapeHTML(album.title)}
                  </strong>

                  <div class="chart-meta">
                    ${escapeHTML(album.artist)}
                  </div>
                </div>

              </div>

            `).join("")
            : `<div class="card"><div class="card-body">Nenhum álbum encontrado.</div></div>`
          }

        </div>

      </div>

    </div>
  `;
}

        class="textarea"

function sendSupport(){

  const text =
    document.getElementById("supportText")
      ?.value.trim();

  if(!text){

    toast("Descreva o problema primeiro.");

    return;
  }

  closeModal();

  toast(
    "Problema registrado para análise."
  );
}
